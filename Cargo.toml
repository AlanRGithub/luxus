[package]
name = "luxus"
version = "0.1.0-beta.1"
edition = "2021"
description = "Fast, lightweight, cross-distro bootable USB creator for Linux written in Rust with Windows UEFI:NTFS, autounattend.xml customization, Linux persistence, and VHD backup"
license = "GPL-3.0-or-later"
keywords = ["usb", "iso", "bootable", "linux", "uefi-ntfs"]
categories = ["gui", "os::linux-apis", "filesystem"]

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.29.1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
